name: Generate Matrix contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Matrix contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#22c55e&color_dots=#ebedf0,#bbf7d0,#86efac,#4ade80,#22c55e
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22c55e&color_dots=#0d1117,#0b2e18,#0f5132,#16a34a,#22c55e

      - name: Push snake assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
